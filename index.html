<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BaptisCard — Chargement</title>
<style>html,body{margin:0;min-height:100%;background:#f7f8fa;font-family:Arial,sans-serif}.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#0D1B3D}.spin{width:28px;height:28px;border:3px solid #dfe3eb;border-top-color:#0D1B3D;border-radius:50%;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div class="spin"></div><div>Chargement de BaptisCard…</div></div>
<script>
(async function(){
  try{
    const base='https://raw.githubusercontent.com/aY-Hack-dev/BaptisCard/ef1190941070ac243b60dd00412703847149ba16/index.html';
    let html=await fetch(base,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text();});
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/jspdf@2\.5\.1\/dist\/jspdf\.umd\.min\.js["']><\/script>/i,'');
    html=html.replace('</body>','<script src="./patch-v2.js"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    document.body.innerHTML='<div class="boot"><strong>Impossible de charger BaptisCard.</strong><div>Vérifiez la connexion puis rechargez la page.</div></div>';
  }
})();
</script>
</body>
</html>
